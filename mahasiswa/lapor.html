<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Buat laporan — Aduan Mahasiswa UT</title>
<link rel="icon" type="image/png" href="../assets/logo-ut-symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <a class="brand" href="beranda.html">
      <img class="brand-logo" src="../assets/logo-ut-symbol.png" alt="">
      <span class="brand-name">Aduan Mahasiswa</span>
    </a>
    <nav class="tabs">
      <a href="beranda.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.8 9.6V20h12.4V9.6"/></svg><span class="tab-label">Beranda</span></a>
      <a href="laporan.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h7.5L18 7.5V21H6z"/><path d="M13.3 3.2V8H18"/><path d="M9 13h6M9 17h4"/></svg><span class="tab-label">Laporan</span></a>
      <a href="lapor.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.5v7M8.5 12h7"/></svg><span class="tab-label">Lapor</span></a>
      <a href="pesan.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11.5H9.5L4 20.5z"/></svg><span class="tab-label">Pesan</span></a>
      <a href="profil.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.9-3.4 3.6-5.2 7-5.2s6.1 1.8 7 5.2"/></svg><span class="tab-label">Profil</span></a>
    </nav>
    <a href="profil.html" class="avatar" aria-label="Profil">AR</a>
  </div>
</header>

<main class="page">

  <div style="padding:28px 0 22px">
    <h1>Buat laporan</h1>
    <p class="muted small" style="margin-top:6px">Satu laporan untuk satu masalah.</p>
  </div>

  <form onsubmit="return false">

    <div class="field">
      <span class="label">Apa yang terjadi? <span class="req">*</span></span>
      <div class="picks">
        <label class="pick"><input type="radio" name="kat" checked>
          <span><span class="pick-t">Tutor tidak aktif</span>
          <span class="pick-d">Tidak membuka inisiasi, tidak hadir tuweb, atau menghilang.</span></span></label>
        <label class="pick"><input type="radio" name="kat">
          <span><span class="pick-t">Tugas atau diskusi tidak dinilai</span>
          <span class="pick-d">Sudah diunggah tetapi nilai belum keluar.</span></span></label>
        <label class="pick"><input type="radio" name="kat">
          <span><span class="pick-t">Kelas Tuton bermasalah</span>
          <span class="pick-d">Materi tidak terbuka, salah kelas, jadwal berubah.</span></span></label>
        <label class="pick"><input type="radio" name="kat">
          <span><span class="pick-t">Layanan UPBJJ</span>
          <span class="pick-d">Pertanyaan tidak terjawab dalam waktu wajar.</span></span></label>
        <label class="pick"><input type="radio" name="kat">
          <span><span class="pick-t">Lainnya</span></span></label>
      </div>
    </div>

    <div class="field" style="margin-top:26px">
      <label for="mk">Mata kuliah <span class="req">*</span></label>
      <select class="select" id="mk">
        <option selected>EKMA4116 - Manajemen</option>
        <option>EKSI4202 - Hukum Pajak</option>
        <option>EKMA4214 - Manajemen Sumber Daya Manusia</option>
        <option>ESPA4110 - Pengantar Ekonomi Makro</option>
        <option>EKMA4115 - Pengantar Akuntansi</option>
      </select>
    </div>

    <div class="field">
      <label for="kelas">Kelas Tuton <span class="req">*</span></label>
      <select class="select" id="kelas">
        <option>Kelas 01</option>
        <option selected>Kelas 02</option>
        <option>Kelas 03</option>
      </select>
    </div>

    <div class="field">
      <label for="judul">Judul laporan <span class="req">*</span></label>
      <input class="input" id="judul" placeholder="Satu kalimat singkat" value="Tutor tidak merespons diskusi sesi 3-5">
    </div>

    <div class="field">
      <label for="isi">Ceritakan kronologinya <span class="req">*</span></label>
      <textarea class="textarea" id="isi">Saya mengirim jawaban diskusi sesi 3 pada 8 September dan sesi 4 pada 14 September. Sampai hari ini belum ada tanggapan maupun penilaian dari tutor. Inisiasi sesi 5 juga belum diunggah padahal jadwalnya sudah lewat tiga hari.</textarea>
      <p class="hint">Sebutkan tanggal dan apa yang sudah Anda coba.</p>
    </div>

    <div class="field">
      <span class="label">Bukti pendukung</span>
      <div class="attach"><span class="attach-ic">PNG</span><span>diskusi-sesi-3.png</span><span class="spacer"></span><button class="btn btn-text btn-sm" type="button">Hapus</button></div>
      <div class="attach"><span class="attach-ic">PNG</span><span>daftar-nilai.png</span><span class="spacer"></span><button class="btn btn-text btn-sm" type="button">Hapus</button></div>
      <button class="add-file" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Tambah foto atau berkas
      </button>
      <p class="hint">JPG, PNG, atau PDF. Maksimal 5 MB per berkas.</p>
    </div>

    <div class="picks" style="margin-bottom:6px">
      <label class="pick"><input type="checkbox">
        <span><span class="pick-t">Kirim sebagai laporan anonim</span>
        <span class="pick-d">Nama Anda disembunyikan dari pihak yang dilaporkan.</span></span></label>
    </div>

    <div class="actions">
      <a class="btn btn-block" href="detail.html">Kirim laporan</a>
      <a class="btn btn-text btn-block" href="beranda.html">Batal</a>
    </div>
  </form>
</main>
</body>
</html>
